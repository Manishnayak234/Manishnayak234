name: Build RideDash APK

on:
  push:
    branches:
      - claude/ridedash-bike-dashboard-g14uv3
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Build the debug APK
        working-directory: ridedash
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Uploaded even when a later step fails, so the APK is downloadable as soon as it exists.
      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ridedash-debug-apk
          path: ridedash/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Unit tests
        working-directory: ridedash
        run: ./gradlew test --no-daemon

      - name: Lint
        working-directory: ridedash
        run: ./gradlew lint --no-daemon

      - name: Upload the lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ridedash-reports
          path: |
            ridedash/app/build/reports/**
          if-no-files-found: warn
