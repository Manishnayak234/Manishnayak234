name: Build RideDash APK

on:
  push:
    branches:
      - claude/ridedash-bike-dashboard-g14uv3
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image already carries an Android SDK; only the pieces this app
      # compiles against need topping up.
      - name: Make sure the SDK has API 35
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"

      - name: Build the debug APK
        working-directory: ridedash
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Uploaded even when a later step fails, so the APK is downloadable as soon as it exists.
      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ridedash-debug-apk
          path: ridedash/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Unit tests
        working-directory: ridedash
        run: ./gradlew test --no-daemon

      # Lint reports but does not withhold the APK: a style finding should not cost a build.
      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: ridedash
        run: ./gradlew lint --no-daemon

      - name: Print the lint findings
        if: always()
        working-directory: ridedash
        run: |
          report=$(find app/build -name 'lint-results-debug.txt' | head -n 1)
          if [ -n "$report" ]; then cat "$report"; else echo "no lint text report found"; fi

      - name: Upload the lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ridedash-reports
          path: ridedash/app/build/reports/**
          if-no-files-found: warn
